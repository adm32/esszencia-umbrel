releaseNotes: >-
  Őszi újdonság: Pumpskin Up szérum és arckrém a Magister Apple & Pump kollekciójából.
  Megújult terméklista a legmodernebb hatóanyagokkal (retinal, bakuchiol, Zanthalene®, rézpeptid, niacinamid, peptid + C-vitamin), árakkal.
  Frissített árlista (nagykezelések, Flow & Relax ~2,5–3 óra / 19 000 Ft).
  Egyszerűbb foglalás: egy koppintással tovább, „legközelebbi szabad időpontok”, ár és időtartam az összegzésben, jelölőnégyzet nélkül.
