  Online időpontfoglalás: lépésről lépésre kezelés, nap és időpont választás, a vendég csak a visszaigazolás után kap e-mailt.
  A nyitvatartás az oldalon automatikusan a Foglalások app beállításaiból frissül.
  Anonim, sütik nélküli látogatottsági statisztika a Foglalások app Statisztika nézetéhez.
  Az új funkciókhoz az „Esszencia Foglalások” app is szükséges; nélküle a foglalás gomb telefonos/e-mailes elérhetőséget mutat.
