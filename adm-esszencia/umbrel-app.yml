description: >-
  Az Esszencia Szépségműhely · Beauty & Relax (Sénye) nyilvános weboldala.


  Természetközeli, „herbárium” hangulatú egyoldalas oldal: bemutatkozás,
  a szezon növénye, kezelések és árak, a Séance-élmény, Magister Products
  termékek, aromaterápia, galéria és kapcsolat.


  Online időpontkérés naptárral: a vendég kiválasztja a kezelést és egy szabad
  időpontot, a kérés az „Esszencia Foglalások” appba érkezik, és csak az elfogadás
  után kap visszaigazoló e-mailt. Ehhez telepítsd az Esszencia Foglalások appot is.


  Négy nyelven (magyar, English, Deutsch, svenska), telefonra optimalizálva.
  Statikus oldal nginx-szel, külső függőség nélkül (a betűtípusok is helyben
  vannak). Az árlista a www/assets/js/services.js fájlban szerkeszthető.
