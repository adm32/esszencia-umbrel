version: "3.7"

services:
  app_proxy:
    environment:
      # <app-id>_<service>_1
      APP_HOST: adm-esszencia_web_1
      APP_PORT: 80
      # Public website: visitors must NOT be asked for the Umbrel login
      PROXY_AUTH_ADD: "false"

  web:
    # Small Go web server (server/main.go, standard library only).
    # It is compiled when the container starts – takes a few seconds the first time.
    image: golang:1.24-alpine
    restart: on-failure
    stop_grace_period: 10s
    working_dir: /src
    command: ["sh", "-c", "go build -buildvcs=false -trimpath -o /tmp/esszencia-site . && exec /tmp/esszencia-site"]
    environment:
      CGO_ENABLED: "0"
      GOTOOLCHAIN: local
      GOCACHE: /tmp/gocache
      WWW_DIR: /www
      LISTEN: ":80"
      API_UPSTREAM: host.docker.internal:4753
    extra_hosts:
      # lets the site reach the booking API published by the Esszencia Foglalások app
      - "host.docker.internal:host-gateway"
    volumes:
      # Umbrel copies this app folder (www/ + server/) into ${APP_DATA_DIR}
      - ${APP_DATA_DIR}/www:/www:ro
      - ${APP_DATA_DIR}/server:/src:ro
