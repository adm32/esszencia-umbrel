version: "3.7"

services:
  app_proxy:
    environment:
      # <app-id>_<service>_1
      APP_HOST: adm-esszencia-foglalasok_server_1
      APP_PORT: 8080
      # Private admin app: Umbrel's login screen stays ON (default).

  server:
    image: node:22-alpine
    restart: on-failure
    stop_grace_period: 5s
    user: "1000:1000"
    working_dir: /app
    command: ["node", "server.js"]
    extra_hosts:
      # reads the treatment list from the Esszencia website app (port 4751)
      - "host.docker.internal:host-gateway"
    environment:
      TZ: Europe/Budapest
      DATA_DIR: /data
      ADMIN_PORT: "8080"
      PUBLIC_PORT: "3001"
      REMOTE_PORT: "8082"
    ports:
      # Public booking API used by the Esszencia website (free times + new requests only).
      - "4753:3001"
      # Same admin app with its own password, for a Cloudflare Tunnel hostname.
      # Stays locked until a password is set from the Umbrel-protected address.
      - "4754:8082"
    volumes:
      - ${APP_DATA_DIR}/server:/app:ro
      - ${APP_DATA_DIR}/data:/data
