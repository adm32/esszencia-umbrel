version: "3.7"

services:
  app_proxy:
    environment:
      # <app-id>_<service>_1
      APP_HOST: adm-esszencia-foglalasok_server_1
      APP_PORT: 8080
      # Private admin app: Umbrel's login screen stays ON (default).

  server:
    # Booking server written in Go (source: server/*.go). It runs the ready-built
    # binary from server/bin/ (rebuild with build.sh), so it starts instantly.
    image: alpine:3.20
    restart: on-failure
    stop_grace_period: 5s
    user: "1000:1000"
    working_dir: /app
    command: ["sh", "-c", "case $$(uname -m) in aarch64|arm64) a=arm64;; *) a=amd64;; esac; cp /app/bin/esszencia-foglalasok-$$a /tmp/esszencia-foglalasok && chmod 755 /tmp/esszencia-foglalasok && exec /tmp/esszencia-foglalasok"]
    extra_hosts:
      # reads the treatment list from the Esszencia website app (port 4751)
      - "host.docker.internal:host-gateway"
    environment:
      TZ: Europe/Budapest
      DATA_DIR: /data
      ADMIN_PORT: "8080"
      PUBLIC_PORT: "3001"
      REMOTE_PORT: "8082"
    ports:
      # Public booking API used by the Esszencia website (free times + new requests only).
      - "4753:3001"
      # Same admin app with its own password, for a Cloudflare Tunnel hostname.
      # Stays locked until a password is set from the Umbrel-protected address.
      - "4754:8082"
    volumes:
      - ${APP_DATA_DIR}/server:/app:ro
      - ${APP_DATA_DIR}/data:/data
