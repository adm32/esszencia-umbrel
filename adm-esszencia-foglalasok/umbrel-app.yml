releaseNotes: >-
  Új: bevétel a Statisztikában – összbevétel, alkalmak, átlag/alkalom, várható bevétel, bevétel naponta/hetente/havonta, kezelésenként, weboldal vs. kézi foglalás és az elmúlt 12 hónap.
  Minden elfogadott, már lezajlott időpont számít, a kézzel felvettek és a korábbi foglalások is (az ár a weboldal árlistájából kerül be). Minden foglalásnál megadható vagy átírható az ár, új kézi foglalásnál az ár magától kitöltődik.
