name: Esszencia Foglalások
tagline: Időpontfoglalások kezelése az Esszencia weboldalhoz
icon: https://raw.githubusercontent.com/adm32/esszencia-umbrel/main/assets/foglalasok-icon.svg
category: productivity
version: "1.3.3"
port: 4752
description: >-
  Privát kezelőfelület az Esszencia Szépségműhely online időpontfoglalásaihoz.


  Az új kérések itt jelennek meg (és e-mailben is értesít róluk). Egy gombnyomással
  elfogadhatod vagy elutasíthatod őket – a vendég ekkor kap e-mailt a saját nyelvén,
  elfogadáskor naptárfájllal. Kézi foglalás (pl. telefonos), áthelyezés, lemondás,
  szabadság/zárás, nyitvatartás és Gmail beállítás.


  Statisztika: a fejlécben lévő gombbal átválthatsz egy egyszerű irányítópultra –
  bevétel (összbevétel, havonta, kezelésenként), látogatók naponta, honnan jöttek, telefon vagy gép, nyelvek, hányan jutottak
  el a foglalásig, mire kattintanak és mely kezeléseket kérik. Anonim, sütik nélkül.


  Adatvédelem: a weboldal sosem mutatja a teljes beosztást – naponta csak néhány
  szabad időpontot ajánl fel titkos, néhány óránként változó sorrendben.


  Az Esszencia weboldal (adm-esszencia) ezen az appon keresztül fogad foglalásokat.
  Telepítsd mindkettőt.
developer: adm
