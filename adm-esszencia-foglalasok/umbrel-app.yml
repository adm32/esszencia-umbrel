releaseNotes: >-
  2.0.0 – szebb és gyorsabb kezelőfelület. A naptár a szalon színeit kapta (zöld kijelölés, a mai nap bekarikázva), a kártyák
  és panelek lágy árnyékot kaptak. Az app fájljai tömörítve érkeznek (kb. harmadakkora letöltés), és ha nem változtak, a telefon
  nem tölti le őket újra. Az „e-mail küldés nincs beállítva” figyelmeztetés csak a Kérések fülön látszik. Javítás: a túl nagy
  kérésre a szerver rendes hibaüzenettel válaszol. A nem használt kód kikerült.
