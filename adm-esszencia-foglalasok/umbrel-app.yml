releaseNotes: >-
  Hibajavítások: a távoli belépés megmarad, ha az értesítő e-mail linkjéről nyitod meg az appot;
  néhány elgépelés vagy foglalt időpont után a vendégeket már nem tiltja ki a rendszer;
  az időpontválasztó nem akad el hálózati hiba vagy gyors napváltás esetén; 4 órás kezelés is áthelyezhető;
  a statisztika fájlja nem nőhet meg kéretlen hivatkozásoktól.
